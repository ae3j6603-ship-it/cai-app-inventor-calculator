<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAI สร้างแอปเครื่องคิดเลขด้วย MIT App Inventor | ม.3</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#142744;background:#eef4fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:#102f60;color:white;padding:18px max(20px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:1.15rem}header small{display:block;color:#bad3f1}header .badge{background:#d8a537;color:#182b48;border-radius:30px;padding:7px 13px;font-weight:700;white-space:nowrap}main{max-width:1160px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:235px 1fr;gap:22px}aside,.panel{background:#fff;border:1px solid #d8e2f0;border-radius:18px;box-shadow:0 8px 30px #1d3b6410}aside{padding:16px;align-self:start;position:sticky;top:15px}aside h2{font-size:1rem;margin:3px 6px 15px}.nav{display:grid;gap:7px}.nav button{text-align:left;border:0;background:transparent;color:#324b6c;padding:12px;border-radius:11px}.nav button.active{background:#163b77;color:white;font-weight:700}.nav button.done:not(.active):after{content:' ✓';color:#218557}.progress{margin:17px 5px 3px;font-size:.9rem}.track{background:#e4ebf5;height:9px;border-radius:30px;margin-top:7px;overflow:hidden}.fill{background:#c89125;height:100%;width:0;transition:.3s}.panel{padding:clamp(20px,4vw,38px);min-height:570px}h1{font-size:clamp(1.5rem,3vw,2rem);line-height:1.3;margin:0 0 8px}h2{font-size:1.22rem;margin:25px 0 10px}p,li{line-height:1.75}p{margin:10px 0}.muted{color:#556984}.eyebrow{color:#996a11;font-size:.86rem;font-weight:800;letter-spacing:.05em}.callout{background:#edf5ff;border-left:5px solid #2c62ad;border-radius:10px;padding:15px 19px;margin:18px 0}.task{background:#fff8e7;border:1px solid #e8d4a1;border-radius:12px;padding:17px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{border:1px solid #d8e2f0;background:#f9fbff;border-radius:12px;padding:15px}.card h3{margin:0 0 6px;font-size:1rem}.card p{margin:0}label{display:block;font-weight:650;margin:12px 0 5px}input[type=number],input[type=text]{width:100%;padding:12px;border:1px solid #9db1cd;border-radius:9px;background:white;color:#152843}input:focus,button:focus-visible{outline:3px solid #eabf59;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}button.primary,.actions button,.choice{border:1px solid #b9cbe2;background:#f2f7ff;color:#15386c;border-radius:10px;padding:10px 15px;font-weight:650}button.primary{background:#164481;color:white;border-color:#164481}button:hover{filter:brightness(.96)}.feedback{min-height:24px;font-weight:700;margin:12px 0;color:#235688}.feedback.good{color:#19714e}.feedback.bad{color:#a33734}.quiz{margin-top:20px;padding:17px;border:1px solid #d5e1f0;border-radius:13px}.quiz legend{font-weight:700;padding:0 5px}.choice{display:block;width:100%;text-align:left;margin:7px 0}.choice.selected{background:#e8f1ff;border-color:#2461b2}.step{background:#f5f8fd;border:1px solid #d8e2f0;border-radius:12px;padding:16px;margin:12px 0}.step h3{margin:0 0 5px;font-size:1.03rem}code{font-size:.94em;background:#e6eef9;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}.block{display:block;background:#233e71;color:#fff;padding:11px 14px;border-radius:8px;margin:8px 0;line-height:1.6;white-space:normal}table{border-collapse:collapse;width:100%;margin:17px 0}th,td{border:1px solid #d8e2f0;padding:10px;text-align:left;vertical-align:top}th{background:#eaf2ff}.tablewrap{overflow-x:auto}.bottom{display:flex;justify-content:space-between;gap:9px;border-top:1px solid #e0e8f3;margin-top:30px;padding-top:18px}.bottom button{border:1px solid #bdcee5;border-radius:9px;padding:10px 17px;background:#fff;color:#15386c;font-weight:650}.bottom button:last-child{background:#173f7b;color:white}.bottom button:disabled{opacity:.4;cursor:default}.hidden{display:none}.mini{font-size:.92rem}.summary{font-size:1.1rem;font-weight:800;color:#164481}@media(max-width:750px){header{padding:15px 18px}main{display:block;margin:14px auto}aside{position:static;margin-bottom:14px}.nav{grid-template-columns:repeat(3,minmax(0,1fr))}.nav button{font-size:.85rem;padding:9px}.panel{min-height:0}.grid{grid-template-columns:1fr}header .badge{font-size:.8rem}}
</style></head><body><header><div><strong>สร้างแอปเครื่องคิดเลข</strong><small>CAI เรียนรู้ด้วยตนเอง · วิทยาการคำนวณ ม.3</small></div><span class="badge">MIT App Inventor</span></header><main><aside><h2>เส้นทางการเรียนรู้</h2><nav class="nav" id="nav"></nav><div class="progress">เรียนแล้ว <b id="progressText">0/6 บท</b><div class="track"><div class="fill" id="progressFill"></div></div></div><p class="mini muted">เรียนทีละบท ทดลองจริง แล้วกด «ถัดไป» เมื่อพร้อม</p></aside><article class="panel"><div id="content"></div><div class="bottom"><button id="prev">← ย้อนกลับ</button><button id="next">บทถัดไป →</button></div></article></main><script>
'use strict';
const titles=['เริ่มภารกิจ','รู้จัก App Inventor','ออกแบบหน้าจอ','ต่อบล็อกคำสั่ง','ทดลองและแก้บั๊ก','ภารกิจและประเมินผล'];
const pre=[{q:'ส่วนใดใช้จัดวางปุ่มและช่องกรอกบนหน้าจอ?',o:['Designer','Blocks','Notifier'],a:0,why:'Designer ใช้วางและตั้งค่าหน้าตาแอป'}, {q:'เมื่อกดปุ่ม + โปรแกรมควรทำสิ่งใดก่อนแสดงผล?',o:['อ่านตัวเลขสองช่องแล้วบวก','เปลี่ยนสีหน้าจอ','ลบข้อมูล'],a:0,why:'ต้องอ่านค่าที่ผู้ใช้กรอกก่อนจึงคำนวณได้'}, {q:'TextBox ทำหน้าที่ใด?',o:['รับข้อมูล','แสดงคำเตือนแบบเด้ง','เก็บไฟล์'],a:0,why:'TextBox เป็นช่องรับข้อมูลจากผู้ใช้'}, {q:'เมื่อหารด้วยศูนย์ ควรทำอย่างไร?',o:['แจ้งเตือนและไม่คำนวณ','แสดงผลเป็น 0','ปิดแอป'],a:0,why:'การหารด้วยศูนย์ไม่มีผลลัพธ์ที่ใช้ได้'}, {q:'บล็อก when btnPlus.Click หมายถึงอะไร?',o:['ทำงานเมื่อกดปุ่มบวก','ทำงานเมื่อเปิดโทรศัพท์','บวกเลขตลอดเวลา'],a:0,why:'when ... Click เป็นเหตุการณ์เมื่อผู้ใช้กดปุ่ม'}];
const post=[{q:'ต้องการอ่านตัวเลขจากช่องแรก ใช้ค่าใด?',o:['txtNumber1.Text','lblAnswer.Text','btnPlus.Text'],a:0,why:'ค่า Text ของช่อง txtNumber1 คือสิ่งที่ผู้ใช้กรอก'}, {q:'ข้อใดเป็นลำดับการทำงานที่ถูกต้อง?',o:['รับค่า → ตรวจข้อมูล → คำนวณ → แสดงผล','แสดงผล → รับค่า → คำนวณ','คำนวณ → รับค่า → ตรวจข้อมูล'],a:0,why:'ตรวจข้อมูลก่อนคำนวณช่วยป้องกันข้อผิดพลาด'}, {q:'ถ้าช่องใดช่องหนึ่งว่าง ควรใช้ตรรกะแบบใด?',o:['ถ้าว่างให้เตือน มิฉะนั้นคำนวณ','คำนวณทันที','เปลี่ยนชื่อปุ่ม'],a:0,why:'if–else ช่วยเลือกงานตามเงื่อนไข'}, {q:'กรอก 12 กับ 4 แล้วกด ÷ ได้เท่าไร?',o:['3','16','48'],a:0,why:'12 ÷ 4 = 3'}, {q:'ปุ่ม Clear ควรล้างค่าใด?',o:['ทั้งช่องเลขสองช่องและข้อความคำตอบ','เฉพาะชื่อแอป','เฉพาะสีปุ่ม'],a:0,why:'ผู้ใช้ควรเริ่มโจทย์ใหม่ได้โดยไม่เหลือค่าเก่า'}];
let page=0;let completed=new Set();let answers={pre:{},post:{},check:{}};let saved={};try{saved=JSON.parse(localStorage.getItem('cai-calculator-m3')||'{}');page=Math.max(0,Math.min(5,Number(saved.page)||0));completed=new Set((saved.completed||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<6));answers=saved.answers||answers}catch{};
const $=id=>document.getElementById(id);function persist(){try{localStorage.setItem('cai-calculator-m3',JSON.stringify({page,completed:[...completed],answers}))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function quiz(kind,items){return `<div id="${kind}Quiz">${items.map((x,i)=>`<fieldset class="quiz"><legend>${i+1}. ${esc(x.q)}</legend>${x.o.map((v,j)=>`<button type="button" class="choice ${answers[kind]?.[i]===j?'selected':''}" data-kind="${kind}" data-q="${i}" data-a="${j}">${esc(v)}</button>`).join('')}</fieldset>`).join('')}</div><button type="button" class="primary" data-grade="${kind}">ตรวจคำตอบ</button><p id="${kind}Feedback" class="feedback" role="status" aria-live="polite"></p>`}
const content=[()=>`<span class="eyebrow">บทที่ 1 · 10 นาที</span><h1>ถ้าไม่มีเครื่องคิดเลขในมือถือ เราสร้างเองได้ไหม?</h1><p>วันนี้เธอจะเป็นคนออกแบบแอปเครื่องคิดเลข บวก ลบ คูณ หาร แล้วทดสอบด้วยตัวเอง เริ่มจากความรู้เดิมใน Scratch ได้เลย</p><div class="callout"><b>เป้าหมาย:</b> สร้างหน้าจอ รับตัวเลขสองค่า ต่อบล็อกคำสั่ง ตรวจข้อมูล และอธิบายได้ว่าแอปทำงานอย่างไร</div><p><b>ก่อนเริ่ม:</b> เตรียมคอมพิวเตอร์ที่เข้าเว็บไซต์ MIT App Inventor ได้ และมือถือสำหรับทดลองผ่าน MIT AI2 Companion หรือใช้ตัวจำลองที่โรงเรียนเตรียมไว้ บทเรียนหน้านี้เปิดอ่านและฝึกได้แม้ไม่มีอินเทอร์เน็ต แต่การสร้างแอปจริงต้องเข้า App Inventor</p><h2>แบบทดสอบก่อนเรียน</h2><p class="muted">ลองตอบตามที่คิด คะแนนนี้มีไว้ดูพัฒนาการ ไม่ต้องกังวล</p>${quiz('pre',pre)}`,
()=>`<span class="eyebrow">บทที่ 2 · 10 นาที</span><h1>รู้จักเครื่องมือสร้างแอป</h1><div class="grid"><div class="card"><h3>🎨 Designer = หน้าตา</h3><p>ลากปุ่ม ช่องกรอก และข้อความมาจัดวาง เหมือนจัดโต๊ะทำงานให้หยิบของง่าย</p></div><div class="card"><h3>🧩 Blocks = สมอง</h3><p>ต่อคำสั่งให้แอปรู้ว่ากดปุ่มแล้วต้องทำอะไร คล้ายต่อบล็อกใน Scratch</p></div></div><div class="task"><b>ลองคิด:</b> ถ้าอยากให้ผู้ใช้พิมพ์เลข ควรใช้ชิ้นส่วนไหน? <div class="actions"><button data-check="textbox">TextBox</button><button data-check="label">Label</button><button data-check="button">Button</button></div><p id="componentFeedback" class="feedback" role="status" aria-live="polite"></p></div><p>จำง่าย ๆ: <b>TextBox รับข้อมูล → Button สั่งงาน → Label แสดงคำตอบ</b></p><p><a href="https://ai2.appinventor.mit.edu/" target="_blank" rel="noopener noreferrer">เปิด MIT App Inventor ↗</a> แล้วสร้างโปรเจกต์ใหม่ชื่อ <code>MyCalculator</code></p>`,
()=>`<span class="eyebrow">บทที่ 3 · 20 นาที</span><h1>วางหน้าจอเครื่องคิดเลข</h1><p>ในหน้า <b>Designer</b> ลากชิ้นส่วนจาก Palette มาวางบน Screen1 แล้วเลือก <b>Rename</b> เพื่อเปลี่ยนชื่อให้จำง่าย ชื่อที่ตั้งไว้จะใช้ในบทต่อไป</p><div class="tablewrap"><table><thead><tr><th>ชิ้นส่วน / ชื่อใหม่</th><th>ค่าที่ตั้งใน Properties</th><th>หน้าที่</th></tr></thead><tbody><tr><td>Label · <code>lblTitle</code></td><td>Text: เครื่องคิดเลขของฉัน; FontSize: 24</td><td>หัวข้อแอป</td></tr><tr><td>TextBox · <code>txtNumber1</code></td><td>Hint: ตัวเลขที่ 1; NumbersOnly: true</td><td>รับเลขตัวแรก</td></tr><tr><td>TextBox · <code>txtNumber2</code></td><td>Hint: ตัวเลขที่ 2; NumbersOnly: true</td><td>รับเลขตัวที่สอง</td></tr><tr><td>Button · <code>btnPlus</code>, <code>btnMinus</code>, <code>btnMultiply</code>, <code>btnDivide</code></td><td>Text: +, −, ×, ÷ ตามลำดับ</td><td>เลือกการคำนวณ</td></tr><tr><td>Button · <code>btnClear</code></td><td>Text: ล้างข้อมูล</td><td>เริ่มโจทย์ใหม่</td></tr><tr><td>Label · <code>lblAnswer</code></td><td>Text: คำตอบจะแสดงที่นี่; FontSize: 20</td><td>แสดงผล</td></tr><tr><td>Notifier · <code>Notifier1</code></td><td>ค่าเริ่มต้น; อยู่ด้านล่างจอในส่วน non-visible</td><td>แจ้งเตือนข้อผิดพลาด</td></tr></tbody></table></div><div class="callout">จะจัดปุ่ม 4 ปุ่มใน <b>HorizontalArrangement</b> หรือเรียงสองแถวก็ได้ ขอให้กดสะดวกบนมือถือ</div><div class="task"><b>เช็กตัวเอง:</b> เมื่อกรอก 7 และ 2 เราอยากให้คำตอบไปแสดงที่ชิ้นส่วนใด? <div class="actions"><button data-check="answer">lblAnswer</button><button data-check="input">txtNumber1</button></div><p id="componentFeedback" class="feedback" role="status" aria-live="polite"></p></div>`,
()=>`<span class="eyebrow">บทที่ 4 · 30 นาที</span><h1>ต่อบล็อกให้แอปคิดเป็น</h1><p>เปิดแท็บ <b>Blocks</b> และใช้ชื่อชิ้นส่วนจากบทที่ 3 คิดเป็นลำดับ <b>กดปุ่ม → ตรวจข้อมูล → คำนวณ → แสดงผล</b></p><div class="step"><h3>1. เริ่มเมื่อกดปุ่ม</h3><span class="block">when btnPlus.Click do ...</span><p>เหมือน “เมื่อกริ่งดัง → เข้าห้องเรียน” โปรแกรมจะรอเหตุการณ์กดปุ่มก่อนทำงาน</p></div><div class="step"><h3>2. ตรวจช่องว่างก่อน</h3><span class="block">if txtNumber1.Text = "" or txtNumber2.Text = ""<br>then call Notifier1.ShowAlert("กรุณากรอกตัวเลขให้ครบ")<br>else ... คำนวณ ...</span><p>เหมือนตรวจตั๋วก่อนขึ้นรถ ถ้าข้อมูลไม่ครบก็ยังไปต่อไม่ได้ ใช้บล็อก <code>if then else</code> จาก Control, <code>or</code> จาก Logic และ <code>=</code> จาก Logic</p></div><div class="step"><h3>3. สร้างปุ่มบวก</h3><span class="block">ในช่อง else: set lblAnswer.Text to (txtNumber1.Text + txtNumber2.Text)</span><p>นำบล็อกบวกจาก Math มาใส่ค่าจาก TextBox ทั้งสองช่อง โปรแกรมรับเลข → บวก → ส่งผลไป Label ถ้าพิมพ์ 10 และ 5 ต้องได้ 15</p></div><div class="step"><h3>4. ทำซ้ำกับลบ คูณ และหาร</h3><p>สร้างเหตุการณ์ <code>when btnMinus.Click</code>, <code>when btnMultiply.Click</code>, <code>when btnDivide.Click</code> แต่ละปุ่มใช้เงื่อนไขตรวจช่องว่างแบบเดียวกัน แล้วเปลี่ยนบล็อก Math เป็น <code>−</code>, <code>×</code>, <code>÷</code></p><p><b>เฉพาะปุ่มหาร:</b> หลังตรวจช่องว่าง ให้ตรวจเพิ่มว่า <code>txtNumber2.Text = 0</code> ถ้าใช่ ให้แจ้ง “ไม่สามารถหารด้วย 0 ได้” มิฉะนั้นค่อยหาร</p></div><div class="step"><h3>5. ต่อปุ่มล้างข้อมูล</h3><span class="block">when btnClear.Click do<br>set txtNumber1.Text to ""<br>set txtNumber2.Text to ""<br>set lblAnswer.Text to "คำตอบจะแสดงที่นี่"</span><p>เหมือนลบกระดานเพื่อเริ่มโจทย์ใหม่</p></div><div class="callout">ถ้าต้องการแสดงทศนิยมให้เป็นระเบียบ ใช้บล็อก <code>format as decimal</code> จาก Math ครอบผลคำนวณ แล้วกำหนดจำนวนตำแหน่งตามที่ต้องการ</div>`,
()=>`<span class="eyebrow">บทที่ 5 · 15 นาที</span><h1>ทดสอบเหมือนนักพัฒนาแอป</h1><p>ลองเครื่องคิดเลขด้านล่างก่อน แล้วทดสอบชุดเดียวกันในแอปที่สร้างผ่าน <b>Connect → AI Companion</b> หรือเครื่องจำลอง เปรียบเทียบผลทีละปุ่ม</p><div class="grid"><div><label for="n1">ตัวเลขที่ 1</label><input id="n1" type="number" step="any" inputmode="decimal" placeholder="เช่น 10"></div><div><label for="n2">ตัวเลขที่ 2</label><input id="n2" type="number" step="any" inputmode="decimal" placeholder="เช่น 5"></div></div><div class="actions"><button data-op="+">+ บวก</button><button data-op="-">− ลบ</button><button data-op="*">× คูณ</button><button data-op="/">÷ หาร</button><button data-op="clear">ล้างข้อมูล</button></div><div class="callout" id="calcResult" role="status" aria-live="polite">คำตอบจะแสดงที่นี่</div><div class="task"><b>ภารกิจทดสอบ:</b> ใส่ 10 และ 5 → ควรได้ 15, 5, 50, 2 ตามลำดับ จากนั้นลองปล่อยช่องว่าง และลองหารด้วย 0 แอปแจ้งเตือนถูกต้องไหม?<p class="mini">ถ้าผลไม่ตรง ให้ย้อนดูบล็อกของปุ่มนั้นและตรวจว่าต่อช่องเลข 1 กับเลข 2 ถูกตำแหน่ง</p></div>`,
()=>`<span class="eyebrow">บทที่ 6 · 15 นาที</span><h1>ภารกิจสุดท้ายของนักสร้างแอป</h1><div class="grid"><div class="card"><h3>Level 1 · แต่งแอปให้เป็นของเรา</h3><p>เปลี่ยนชื่อแอป สีปุ่ม และจัดตำแหน่งให้ใช้ง่าย ตรวจว่าปุ่ม Clear ล้างทั้งสองช่องและคำตอบ</p></div><div class="card"><h3>Level 2 · กันข้อผิดพลาด</h3><p>เพิ่ม/ตรวจเงื่อนไขช่องว่างและการหารด้วย 0 พร้อมข้อความแจ้งเตือนที่เพื่อนอ่านแล้วเข้าใจ</p></div></div><div class="task"><b>ส่งงานให้ครู:</b> แสดงแอปที่กดได้จริง พร้อมสาธิต 10 + 5, 10 ÷ 5, ช่องว่าง และ 10 ÷ 0 อธิบายว่าบล็อก <code>if–else</code> ช่วยอะไร</div><h2>แบบทดสอบหลังเรียน</h2>${quiz('post',post)}<div id="finalSummary" class="summary" aria-live="polite"></div><h2>สะท้อนการเรียนรู้</h2><p>วันนี้ฉันภูมิใจตรงไหนที่สุด และถ้ามีเวลาอีกหนึ่งคาบ ฉันอยากเพิ่มอะไรในแอป?</p><textarea id="reflection" rows="3" style="width:100%;padding:12px;border:1px solid #9db1cd;border-radius:9px;font:inherit" placeholder="พิมพ์ความคิดของฉัน (บันทึกไว้บนอุปกรณ์นี้)"></textarea><div class="actions"><button id="saveReflection">บันทึกความคิด</button><button id="resetProgress">เริ่มเรียนใหม่</button></div><p class="muted mini">ความก้าวหน้าและคำตอบเก็บไว้ในเบราว์เซอร์ของอุปกรณ์นี้เท่านั้น หากเปลี่ยนอุปกรณ์หรือเคลียร์ข้อมูลเบราว์เซอร์ ข้อมูลจะหายไป</p>`];
function render(){ $('nav').innerHTML=titles.map((t,i)=>`<button class="${i===page?'active':''} ${completed.has(i)?'done':''}" data-page="${i}" ${i===page?'aria-current="page"':''}>${i+1}. ${t}</button>`).join('');$('progressText').textContent=`${completed.size}/6 บท`;$('progressFill').style.width=(completed.size/6*100)+'%';$('content').innerHTML=content[page]();$('prev').disabled=page===0;$('next').textContent=page===5?'เรียนจบแล้ว ✓':'บทถัดไป →';$('next').disabled=page===5;if(page===5){$('reflection').value=saved.reflection||'';if(saved.postScore!==undefined)$('finalSummary').textContent=`คะแนนหลังเรียน ${saved.postScore}/5 คะแนน`;}}function goto(n){completed.add(page);page=n;persist();render();window.scrollTo({top:0,behavior:'smooth'})} $('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)goto(Number(b.dataset.page))});$('prev').onclick=()=>{if(page>0)goto(page-1)};$('next').onclick=()=>{if(page<5)goto(page+1)};
$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.kind){let k=b.dataset.kind,i=Number(b.dataset.q);answers[k][i]=Number(b.dataset.a);persist();b.parentElement.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.classList.toggle('selected',x===b));return}if(b.dataset.grade){let k=b.dataset.grade,qs=k==='pre'?pre:post,count=qs.reduce((a,x,i)=>a+(answers[k][i]===x.a?1:0),0);let missing=qs.filter((_,i)=>answers[k][i]===undefined).length;let f=$(k+'Feedback');if(missing){f.textContent=`ยังไม่ได้ตอบ ${missing} ข้อ ลองตอบให้ครบก่อน`;f.className='feedback bad';return}f.innerHTML=`ได้ ${count}/${qs.length} คะแนน<br>`+qs.map((x,i)=>`${i+1}. ${answers[k][i]===x.a?'✓':'✗'} ${esc(x.why)}`).join('<br>');f.className='feedback '+(count>=4?'good':'bad');if(k==='post'){saved.postScore=count;$('finalSummary').textContent=`คะแนนหลังเรียน ${count}/5 คะแนน`;completed.add(5);persist();$('progressText').textContent=`${completed.size}/6 บท`;$('progressFill').style.width=(completed.size/6*100)+'%'}return}if(b.dataset.check){let good=['textbox','answer'].includes(b.dataset.check),f=$('componentFeedback');f.textContent=good?'ถูกต้อง! ช่องรับข้อมูลใช้ TextBox ส่วนคำตอบแสดงใน lblAnswer':'ลองอีกครั้ง: ช่องรับข้อมูลคือ TextBox และที่แสดงคำตอบคือ lblAnswer';f.className='feedback '+(good?'good':'bad');return}if(b.dataset.op){if(b.dataset.op==='clear'){$('n1').value='';$('n2').value='';$('calcResult').textContent='คำตอบจะแสดงที่นี่';return}let a=$('n1').value.trim(),c=$('n2').value.trim(),out=$('calcResult');if(a===''||c===''){out.textContent='กรุณากรอกตัวเลขให้ครบ';return}let x=Number(a),y=Number(c);if(!Number.isFinite(x)||!Number.isFinite(y)){out.textContent='กรุณากรอกตัวเลขที่ถูกต้อง';return}if(b.dataset.op==='/'&&y===0){out.textContent='ไม่สามารถหารด้วย 0 ได้';return}let v={'+':()=>x+y,'-':()=>x-y,'*':()=>x*y,'/':()=>x/y}[b.dataset.op]();out.textContent=`คำตอบ: ${Number.isInteger(v)?v:Number(v.toFixed(8))}`;return}if(b.id==='saveReflection'){saved.reflection=$('reflection').value;persist();b.textContent='บันทึกแล้ว ✓';return}if(b.id==='resetProgress'){if(confirm('เริ่มใหม่และลบคะแนนกับความก้าวหน้าบนอุปกรณ์นี้หรือไม่?')){localStorage.removeItem('cai-calculator-m3');saved={};page=0;completed=new Set();answers={pre:{},post:{},check:{}};render();window.scrollTo(0,0)}}});render();
</script></body></html>

:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#172b47;background:#f1f5fb}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}header{background:#102d5b;color:#fff;padding:16px max(18px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header b{font-size:1.15rem}header small{display:block;color:#bad2f1}header span{background:#d9aa42;color:#1b2c45;padding:7px 13px;border-radius:20px;font-weight:800;white-space:nowrap}main{max-width:1120px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:20px}aside,article{background:#fff;border:1px solid #dce5f0;border-radius:17px;box-shadow:0 8px 28px #18395d0c}aside{padding:16px;align-self:start;position:sticky;top:12px}aside h2{font-size:1rem;margin:4px 5px 13px}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:10px;text-align:left;padding:11px;background:transparent;color:#38516e}.nav button.active{background:#174479;color:#fff;font-weight:750}.nav button.done:not(.active):after{content:' ✓';color:#207b59}.track{height:9px;border-radius:20px;background:#e6edf6;overflow:hidden;margin:7px 0}.fill{height:100%;background:#d5a33a;width:0;transition:.25s}article{padding:clamp(20px,4vw,38px);min-height:620px}h1{font-size:clamp(1.5rem,3vw,2rem);line-height:1.3;margin:5px 0 10px}h2{font-size:1.24rem;margin:24px 0 10px}h3{font-size:1.06rem;margin:0 0 7px}p,li{line-height:1.7}p{margin:10px 0}.muted{color:#576b82}.eyebrow{font-size:.88rem;font-weight:800;color:#95630a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,.scene{background:#f8fbff;border:1px solid #dce6f4;border-radius:13px;padding:16px}.scene{margin:17px 0}.mock{max-width:470px;border:1px solid #b9cce3;background:#fff;border-radius:17px;margin:14px auto;overflow:hidden;box-shadow:0 8px 20px #173b5a12}.mockhead{background:#133761;color:#fff;padding:13px 16px;font-weight:700}.mockbody{padding:17px}.mockfoot{border-top:1px solid #e0e8f2;padding:10px 15px;color:#607289;font-size:.9rem}.image{width:100%;height:auto;display:block}.callout{background:#eaf3ff;border-left:5px solid #2b68a8;border-radius:9px;padding:14px 17px;margin:16px 0}.warn{background:#fff6e3;border-left-color:#bd8623}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin:13px 0}button.choice,button.primary,button.secondary{border:1px solid #afc4de;border-radius:10px;padding:10px 14px;background:#f3f8ff;color:#173d6e;font-weight:680}button.primary{background:#17477f;color:#fff;border-color:#17477f}button.choice.selected{background:#e5f1ff;border-color:#1d69bd}.feedback{min-height:24px;font-weight:750;color:#1b5e9c;margin:9px 0}.feedback.good{color:#177052}.feedback.bad{color:#aa3f32}.quiz{border:1px solid #d6e3f1;border-radius:12px;margin:13px 0;padding:15px}.quiz legend{font-weight:700;padding:0 5px}.quiz .choice{display:block;width:100%;text-align:left;margin:7px 0}.bottom{display:flex;justify-content:space-between;border-top:1px solid #e0e9f4;padding-top:18px;margin-top:30px;gap:9px}.bottom button{padding:10px 15px;border-radius:9px;border:1px solid #aac0d9;color:#173f71;background:#fff;font-weight:700}.bottom button:last-child{background:#17477f;color:#fff}.bottom button:disabled{opacity:.45;cursor:default}textarea{width:100%;min-height:90px;border:1px solid #a8bbd2;border-radius:9px;padding:12px;resize:vertical}textarea:focus-visible,button:focus-visible{outline:3px solid #eebc50;outline-offset:2px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#e9f3ff;color:#17477f;font-weight:700;font-size:.88rem}.score{font-size:1.15rem;font-weight:800;color:#165587}.footpath{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0}.footpath span{background:#eaf1fa;border-radius:10px;padding:10px 12px}.footpath b{color:#bc8725}@media(max-width:740px){main{display:block;margin:14px auto}aside{position:static;margin-bottom:13px}.nav{grid-template-columns:repeat(3,minmax(0,1fr))}.nav button{font-size:.86rem;padding:9px}.grid{grid-template-columns:1fr}article{min-height:0}header span{font-size:.82rem}}
</style></head><body><header><div><b>รู้ทันโลกดิจิทัล</b><small>CAI เรียนรู้ด้วยตนเอง · วิทยาการคำนวณ ม.3</small></div><span>50 นาที</span></header><main><aside><h2>เส้นทางของฉัน</h2><nav class="nav" id="nav" aria-label="บทเรียน"></nav><p class="muted">เรียนแล้ว <b id="progress">0/6 บท</b></p><div class="track"><div class="fill" id="fill"></div></div><p class="muted" style="font-size:.88rem">คลิกบทเรียนได้ตามต้องการ ตอบคำถามแล้วดูเฉลยทันที</p></aside><article><div id="content"></div><div class="bottom"><button id="prev">← ย้อนกลับ</button><button id="next">บทถัดไป →</button></div></article></main><script>
'use strict';const titles=['เริ่มต้น','ความเป็นส่วนตัว','ข่าวจริงหรือหลอก','ใช้ AI ให้เป็น','รอยเท้าดิจิทัล','ภารกิจและทดสอบ'];const qs=[{q:'บัญชีแปลกหน้าใน Instagram ขอรูปบัตรนักเรียนเพื่อรับรางวัล จะทำอย่างไร?',o:['ส่งรูปก่อน เพราะของรางวัลมีจำนวนจำกัด','ไม่ส่งข้อมูล ตรวจจากช่องทางทางการ และรายงานบัญชีที่น่าสงสัย','แชร์ให้เพื่อนลองก่อน'],a:1,why:'ข้อมูลในบัตรเป็นข้อมูลส่วนตัว ข้อเสนอที่เร่งให้ส่งข้อมูลควรหยุดตรวจสอบก่อน'},{q:'คลิป TikTok บอกว่าพรุ่งนี้โรงเรียนหยุด แต่ไม่บอกที่มา ควรทำอย่างไร?',o:['แชร์ทันทีเพราะยอดดูสูง','เชื่อเพราะมีคนคอมเมนต์เยอะ','ตรวจวันที่และประกาศจากช่องทางทางการของโรงเรียน'],a:2,why:'ยอดดูหรือคอมเมนต์ไม่ใช่หลักฐานยืนยัน ต้องย้อนกลับไปหาแหล่งต้นทาง'},{q:'ใช้ ChatGPT ช่วยทำการบ้านแบบใดจึงช่วยให้เราเรียนรู้?',o:['ให้เขียนทั้งหมดแล้วคัดลอกส่ง','ขอคำอธิบายและแบบฝึก แล้วตรวจและเขียนสรุปด้วยตนเอง','ให้สร้างแหล่งอ้างอิงโดยไม่เปิดอ่าน'],a:1,why:'ใช้ AI เป็นผู้ช่วยเรียนและตรวจข้อมูลด้วยตนเอง'},{q:'ภาพที่เพื่อนจะโพสต์เห็นเบอร์โทรของนักเรียนอีกคน ควรทำอย่างไร?',o:['ขอให้ปิดข้อมูลและขอความยินยอมก่อนโพสต์','ปล่อยไว้เพราะคนในห้องรู้จักกัน','แชร์ต่อเพื่อเตือนเพื่อน'],a:0,why:'ข้อมูลของคนอื่นควรได้รับการปกป้อง แม้โพสต์ในกลุ่มเพื่อน'},{q:'กำลังโกรธเพื่อนและอยากคอมเมนต์กล่าวหาในที่สาธารณะ ควรทำอย่างไร?',o:['โพสต์ก่อนแล้วค่อยลบ','หยุดทบทวนข้อเท็จจริง และคุยผ่านช่องทางที่เหมาะสม','ให้เพื่อนอีกคนโพสต์แทน'],a:1,why:'ข้อความอาจถูกบันทึกหรือส่งต่อได้ การหยุดคิดช่วยลดผลเสียกับทุกฝ่าย'}];let page=0,done=new Set(),ans={},notes={};try{const s=JSON.parse(localStorage.getItem('cai-digital-m3')||'{}');page=Math.max(0,Math.min(5,Number(s.page)||0));done=new Set((s.done||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<6));ans=s.ans||{};notes=s.notes||{}}catch{}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('cai-digital-m3',JSON.stringify({page,done:[...done],ans,notes}))}catch{}}function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function visual(kind){if(kind==='profile')return `<svg class="image" viewBox="0 0 680 230" role="img" aria-label="ภาพจำลองโปรไฟล์ที่เปิดเผยโรงเรียน เวลาเลิกเรียน และที่อยู่"><rect width="680" height="230" rx="18" fill="#dbeafd"/><circle cx="113" cy="83" r="43" fill="#6594c6"/><path d="M47 184q20-57 66-57t66 57" fill="#6594c6"/><rect x="212" y="29" width="416" height="171" rx="15" fill="white"/><text x="236" y="64" fill="#193b67" font-size="23" font-weight="bold">โปรไฟล์สมมติ · มิน</text><text x="236" y="103" fill="#405b7b" font-size="19">📍 โรงเรียนแถวบ้าน / เลิกเรียน 16.00 น.</text><text x="236" y="139" fill="#405b7b" font-size="19">“รอรถคนเดียวที่ป้ายเดิมทุกวัน”</text><text x="236" y="177" fill="#a03f35" font-size="18">การมองเห็นโพสต์: ทุกคน</text></svg>`;if(kind==='news')return `<svg class="image" viewBox="0 0 680 220" role="img" aria-label="ภาพจำลองโพสต์ข่าวหยุดเรียนที่ไม่มีแหล่งอ้างอิง"><rect width="680" height="220" rx="18" fill="#e2edfa"/><rect x="66" y="22" width="548" height="177" rx="16" fill="white"/><circle cx="100" cy="60" r="17" fill="#d5a542"/><text x="129" y="66" fill="#325171" font-size="18">ข่าวดังวันนี้ · ไม่ระบุแหล่งข่าว</text><text x="92" y="113" fill="#152e54" font-size="27" font-weight="bold">“พรุ่งนี้โรงเรียนหยุด! แชร์ด่วน”</text><text x="92" y="156" fill="#9b6820" font-size="17">ยอดแชร์ 12,000 ครั้ง · ไม่เห็นวันที่ประกาศ</text></svg>`;return `<svg class="image" viewBox="0 0 680 220" role="img" aria-label="ภาพจำลองแชต AI เปรียบเทียบการขอให้ทำงานแทนกับการขอคำอธิบาย"><rect width="680" height="220" rx="18" fill="#e4eef9"/><rect x="42" y="26" width="596" height="73" rx="14" fill="#ffe8d8"/><text x="66" y="55" fill="#6c3b24" font-size="17">คำถามแบบคัดลอกงาน</text><text x="66" y="82" fill="#6c3b24" font-size="20" font-weight="bold">“เขียนรายงานให้ทั้งหมด ฉันจะส่งเลย”</text><rect x="42" y="119" width="596" height="76" rx="14" fill="#d7f1e9"/><text x="66" y="149" fill="#175c4c" font-size="17">คำถามแบบช่วยเรียนรู้</text><text x="66" y="178" fill="#175c4c" font-size="20" font-weight="bold">“อธิบายสั้น ๆ แล้วถามฉัน 3 ข้อ”</text></svg>`}const pages=[()=>`<span class="eyebrow">บทที่ 1 · 5 นาที</span><h1>ก่อนกดแชร์ หยุดคิด 3 วินาที</h1><p>เราใช้ TikTok, Instagram, Discord และ AI ได้คล่อง แต่บางครั้งโพสต์เดียว ลิงก์เดียว หรือคำตอบเดียวก็พาเราไปเจอปัญหาได้</p><div class="grid"><div class="card"><h3>วันนี้จะฝึกอะไร?</h3><p>ปกป้องข้อมูลส่วนตัว เช็กข่าวก่อนแชร์ ใช้ AI ช่วยคิด และดูแลรอยเท้าดิจิทัล</p></div><div class="card"><h3>วิธีเรียน</h3><p>อ่านภาพสถานการณ์ เลือกคำตอบ รับคำอธิบายทันที และทำภารกิจของตัวเองท้ายบท</p></div></div><div class="callout">สูตรจำง่าย: <b>หยุด → เช็ก → เลือก</b> ใช้ได้ก่อนกดลิงก์ โพสต์ แชร์ หรือส่งข้อมูล</div><div class="scene"><b>ลองคิด:</b> มีคนส่งลิงก์ “ของฟรี เหลือ 10 นาที” มาใน Discord เราควรทำอะไรเป็นอย่างแรก?<div class="buttons"><button class="choice" data-quick="wrong">รีบกดก่อนหมดเวลา</button><button class="choice" data-quick="right">หยุดและตรวจแหล่งที่มา</button></div><p id="quickFeedback" class="feedback" role="status" aria-live="polite"></p></div>`,()=>`<span class="eyebrow">บทที่ 2 · 8 นาที</span><h1>โปรไฟล์บอกอะไรเกี่ยวกับเรา?</h1><p>ภาพ ตัวหนังสือ สถานที่ และเวลาในโพสต์อาจต่อกันเป็นข้อมูลที่บอกว่าเราอยู่ที่ไหนหรือทำอะไรเป็นประจำ ลองดูภาพสมมตินี้</p><div class="scene">${visual('profile')}<p class="muted">ภาพประกอบสถานการณ์สมมติ ไม่ใช่โปรไฟล์ของบุคคลจริง</p></div><div class="callout"><b>เช็ก 3 จุด:</b> ใครเห็นโพสต์ได้? ใครส่งข้อความมาได้? ภาพหรือคำบรรยายเปิดเผยสถานที่ เวลา หรือข้อมูลเพื่อนหรือไม่? เมนูและตัวเลือกในแต่ละแอปอาจเปลี่ยนได้</div><div class="scene"><b>เลือกสองข้อมูลที่มินควรระวังมากที่สุด</b><div class="buttons"><button class="choice" data-pick="school">ชื่อ/ตำแหน่งโรงเรียน</button><button class="choice" data-pick="time">เวลาและจุดรอรถประจำ</button><button class="choice" data-pick="color">สีพื้นหลังโปรไฟล์</button></div><button class="primary" data-verify="privacy">ตรวจคำตอบ</button><p id="privacyFeedback" class="feedback" role="status" aria-live="polite"></p></div><p>หากเจอข้อความคุกคามหรือขอข้อมูลส่วนตัว ให้หยุดตอบ เก็บหลักฐานเท่าที่จำเป็น และปรึกษาผู้ใหญ่ที่ไว้ใจได้</p>`,()=>`<span class="eyebrow">บทที่ 3 · 8 นาที</span><h1>ยอดแชร์เยอะ = ข่าวจริงไหม?</h1><p>ข่าวปลอมบางชิ้นทำให้เราตกใจหรือรีบส่งต่อ ลองดูโพสต์สมมติ</p><div class="scene">${visual('news')}<p class="muted">ภาพประกอบสถานการณ์สมมติ</p></div><div class="grid"><div class="card"><h3>เช็ก 4 อย่าง</h3><p>ใครเป็นต้นทาง? ลงเมื่อไร? มีหลักฐานอะไร? แหล่งอื่นที่เชื่อถือได้ยืนยันไหม?</p></div><div class="card"><h3>ถ้ายังไม่แน่ใจ</h3><p>หยุดแชร์ไว้ก่อน และเปิดช่องทางทางการของโรงเรียนด้วยตนเองเพื่อตรวจประกาศ</p></div></div><div class="scene"><b>คำถาม:</b> เพื่อนส่งโพสต์นี้มาพร้อมถาม “จริงไหม?” จะตอบอย่างไร?<div class="buttons"><button class="choice" data-quick="newsbad">จริงแน่ ยอดแชร์เยอะ</button><button class="choice" data-quick="newsok">ยังไม่แน่ใจ ขอเช็กประกาศโรงเรียนก่อน</button></div><p id="quickFeedback" class="feedback" role="status" aria-live="polite"></p></div>`,()=>`<span class="eyebrow">บทที่ 4 · 8 นาที</span><h1>ใช้ AI ให้ฉลาดกว่าเดิม</h1><p>ChatGPT ช่วยอธิบายเรื่องยาก ตั้งคำถามฝึก และชี้ทางค้นคว้าได้ แต่คำตอบอาจผิดหรือขาดบริบท เราจึงต้องตรวจและเขียนสิ่งที่เข้าใจเอง</p><div class="scene">${visual('ai')}<p class="muted">ภาพประกอบคำถามสมมติสำหรับเปรียบเทียบวิธีใช้ AI</p></div><div class="callout warn"><b>ก่อนถาม AI:</b> ไม่ใส่รหัสผ่าน เบอร์โทร หรือข้อมูลส่วนตัวของตนและเพื่อน · หลังได้คำตอบ: ตรวจข้อเท็จจริงกับแหล่งที่มา และทำตามกติกาการใช้ AI ของครู</div><h2>ลองเขียน Prompt ช่วยเรียน</h2><p>หัวข้อ “ข่าวปลอม” ลองขอให้ AI อธิบายแบบเข้าใจง่าย พร้อมตั้งคำถามให้เราตอบเอง</p><textarea id="promptText" placeholder="ตัวอย่าง: อธิบายวิธีเช็กข่าวปลอมสำหรับ ม.3 ด้วยตัวอย่างใกล้ตัว แล้วถามฉัน 3 ข้อโดยยังไม่เฉลย"></textarea><div class="buttons"><button class="primary" data-save="prompt">บันทึกคำถามของฉัน</button></div><p id="saveFeedback" class="feedback" role="status" aria-live="polite"></p>`,()=>`<span class="eyebrow">บทที่ 5 · 8 นาที</span><h1>รอยเท้าดิจิทัลไม่ได้หยุดที่ปุ่มลบ</h1><p>คอมเมนต์หรือรูปที่โพสต์อาจถูกแคป ส่งต่อ หรือถูกคนอื่นเห็นในเวลาที่เราไม่คาดคิด ลองมองเส้นทางของข้อความสมมติ</p><div class="footpath"><span>พิมพ์ตอนโกรธ</span><b>→</b><span>เพื่อนเห็น</span><b>→</b><span>มีคนแคปหน้าจอ</span><b>→</b><span>ถูกส่งต่อ</span></div><div class="scene"><div class="mock"><div class="mockhead">โพสต์สมมติ · กลุ่มเพื่อน</div><div class="mockbody">“คนนั้นโกงงานกลุ่ม อย่าไปคบ!”<br><span class="muted">ยังไม่ได้ตรวจข้อเท็จจริง และมีคนอื่นระบุตัวเพื่อนได้</span></div><div class="mockfoot">ภาพจำลองเพื่อฝึกคิด ไม่ใช่โพสต์จริง</div></div><b>ถ้าเราเป็นคนพิมพ์ ควรทำอย่างไร?</b><div class="buttons"><button class="choice" data-quick="footbad">โพสต์ก่อน แล้วลบทีหลัง</button><button class="choice" data-quick="footok">พักก่อน ตรวจข้อเท็จจริง แล้วคุยอย่างเหมาะสม</button></div><p id="quickFeedback" class="feedback" role="status" aria-live="polite"></p></div><div class="callout">ก่อนโพสต์ถามตัวเอง: <b>จริงไหม? จำเป็นไหม? กระทบใคร? ถ้าถูกส่งต่อจะยังโอเคไหม?</b></div>`,()=>`<span class="eyebrow">บทที่ 6 · 13 นาที</span><h1>ภารกิจของฉัน + แบบทดสอบ</h1><div class="scene"><b>ภารกิจ 1:</b> เลือกการปรับพฤติกรรมออนไลน์หนึ่งอย่างที่ทำได้จริงภายในสัปดาห์นี้ เช่น ตรวจผู้ชมโพสต์ หรือเช็กแหล่งข่าวก่อนแชร์<textarea id="actionText" placeholder="ฉันจะ... เพราะ..." aria-label="แผนปรับพฤติกรรมออนไลน์"></textarea><div class="buttons"><button class="primary" data-save="action">บันทึกแผน</button></div><p id="saveFeedback" class="feedback" role="status" aria-live="polite"></p></div><h2>Pop Quiz: เลือกคำตอบที่ดีที่สุด</h2>${qs.map((q,i)=>`<fieldset class="quiz"><legend>${i+1}. ${escapeHTML(q.q)}</legend>${q.o.map((a,j)=>`<button class="choice ${ans[i]===j?'selected':''}" data-q="${i}" data-answer="${j}">${escapeHTML(a)}</button>`).join('')}</fieldset>`).join('')}<div class="buttons"><button class="primary" id="grade">ตรวจคำตอบ</button><button class="secondary" id="reset">เริ่มเรียนใหม่</button></div><p id="result" class="feedback" role="status" aria-live="polite"></p><p class="muted" style="font-size:.9rem">ความก้าวหน้าและข้อความที่พิมพ์ถูกเก็บเฉพาะในเบราว์เซอร์ของอุปกรณ์นี้ ไม่ส่งให้ครูหรือผู้สร้างบทเรียนโดยอัตโนมัติ</p>`];function render(){$('nav').innerHTML=titles.map((t,i)=>`<button data-page="${i}" class="${i===page?'active':''} ${done.has(i)?'done':''}" ${i===page?'aria-current="page"':''}>${i+1}. ${t}</button>`).join('');$('content').innerHTML=pages[page]();$('progress').textContent=`${done.size}/6 บท`;$('fill').style.width=(done.size/6*100)+'%';$('prev').disabled=page===0;$('next').disabled=page===5;$('next').textContent=page===5?'เรียนจบแล้ว ✓':'บทถัดไป →';if(page===3)$('promptText').value=notes.prompt||'';if(page===5){$('actionText').value=notes.action||'';if(notes.score!==undefined)$('result').textContent=`คะแนนล่าสุด ${notes.score}/5 คะแนน`}}function goto(n){done.add(page);page=n;save();render();window.scrollTo({top:0,behavior:'smooth'})}$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)goto(Number(b.dataset.page))};$('prev').onclick=()=>page>0&&goto(page-1);$('next').onclick=()=>page<5&&goto(page+1);let picked=new Set();$('content').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.pick){picked.has(b.dataset.pick)?picked.delete(b.dataset.pick):picked.add(b.dataset.pick);b.classList.toggle('selected');return}if(b.dataset.verify){let good=picked.has('school')&&picked.has('time')&&!picked.has('color');$('privacyFeedback').textContent=good?'ถูกต้อง! สถานที่และกิจวัตรบอกตำแหน่งของเราได้':'ลองอีกครั้ง: มองหาข้อมูลที่บอกสถานที่และเวลาที่มินอยู่ประจำ';$('privacyFeedback').className='feedback '+(good?'good':'bad');return}if(b.dataset.quick){const good=['right','newsok','footok'].includes(b.dataset.quick);$('quickFeedback').textContent=good?'ใช่เลย! หยุดตรวจข้อมูลก่อนช่วยให้เลือกได้ปลอดภัยขึ้น':'ลองคิดอีกครั้ง: ความเร่งรีบ ยอดแชร์ หรือการลบภายหลังไม่ได้รับประกันความปลอดภัย';$('quickFeedback').className='feedback '+(good?'good':'bad');return}if(b.dataset.save){const key=b.dataset.save;const v=$(key==='prompt'?'promptText':'actionText').value.trim();if(!v){$('saveFeedback').textContent='ลองเขียนคำตอบก่อนบันทึก';return}notes[key]=v;save();$('saveFeedback').textContent='บันทึกบนอุปกรณ์นี้แล้ว ✓';$('saveFeedback').className='feedback good';return}if(b.dataset.q!==undefined){let i=Number(b.dataset.q);ans[i]=Number(b.dataset.answer);save();b.parentElement.querySelectorAll('[data-answer]').forEach(el=>el.classList.toggle('selected',el===b));return}if(b.id==='grade'){let missing=qs.filter((_,i)=>ans[i]===undefined).length;if(missing){$('result').textContent=`ยังไม่ได้ตอบ ${missing} ข้อ`;return}let score=qs.reduce((n,q,i)=>n+(ans[i]===q.a?1:0),0);notes.score=score;done.add(5);save();$('progress').textContent=`${done.size}/6 บท`;$('fill').style.width=(done.size/6*100)+'%';$('result').innerHTML=`ได้ ${score}/5 คะแนน<br>`+qs.map((q,i)=>`${i+1}. ${ans[i]===q.a?'✓':'✗'} ${escapeHTML(q.why)}`).join('<br>');$('result').className='feedback '+(score>=4?'good':'bad');return}if(b.id==='reset'&&confirm('ลบความก้าวหน้า คะแนน และข้อความที่บันทึกบนอุปกรณ์นี้เพื่อเริ่มใหม่หรือไม่?')){try{localStorage.removeItem('cai-digital-m3')}catch{}page=0;done=new Set();ans={};notes={};picked=new Set();render();window.scrollTo(0,0)}};render();</script></body></html>
